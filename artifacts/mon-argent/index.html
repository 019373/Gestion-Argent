
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0c">
<title>Gestion-Argent</title>
<style>
:root {
  color-scheme: dark;
  --bg: #090b0c;
  --card: #141819;
  --card2: #1b2021;
  --border: #293032;
  --text: #f4f6f5;
  --muted: #929d9b;
  --green: #39c98b;
  --red: #f16a72;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
}
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
header {
  position: sticky;
  top: 0;
  background: #090b0cf2;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 3;
}
.head {
  max-width: 1110px;
  margin: auto;
  padding: 16px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.brand {
  font-size: 20px;
  letter-spacing: -.5px;
  font-weight: 800;
}
.brand i {
  color: var(--green);
  font-style: normal;
}
.head button { display: none; }
.layout {
  max-width: 1110px;
  margin: auto;
  display: grid;
  grid-template-columns: 192px minmax(0, 1fr);
  gap: 30px;
  padding: 30px 22px 90px;
}
nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: sticky;
  top: 92px;
  align-self: start;
}
nav button {
  display: flex;
  gap: 11px;
  align-items: center;
  background: transparent;
  border: 0;
  color: var(--muted);
  border-radius: 12px;
  text-align: left;
  padding: 13px;
  font-weight: 600;
}
nav button.active {
  background: #18342b;
  color: var(--green);
}
.icon {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
  width: 20px;
  height: 20px;
}
main { min-width: 0; }
h1 {
  font-size: 27px;
  letter-spacing: -.8px;
  margin: 0;
}
h2 { font-size: 16px; margin: 0 0 16px; }
h3 { font-size: 14px; margin: 0 0 8px; }
p { margin: 8px 0 14px; color: var(--muted); }
.caption { color: var(--muted); font-size: 12px; }
.toprow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 23px;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.card {
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  margin-bottom: 14px;
  min-width: 0;
}
.card.main-card {
  background: linear-gradient(130deg, #163d30, #13231f 80%);
  border-color: #24523f;
}
.metric {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.6px;
  margin-top: 7px;
  overflow-wrap: anywhere;
}
.green { color: var(--green); }
.red { color: var(--red); }
.muted { color: var(--muted); }
.line {
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}
.line:last-child { border: 0; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.min0 { min-width: 0; }
.truncate { overflow-wrap: anywhere; }
.btn {
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
}
.btn.green-btn {
  background: var(--green);
  color: #062215;
  border-color: var(--green);
}
.btn.red-btn { color: var(--red); }
.btn.small { padding: 6px 9px; font-size: 12px; }
.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 13px;
}
.formgrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.field { min-width: 0; }
.field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin: 0 0 5px;
}
input, select {
  width: 100%;
  min-width: 0;
  color: var(--text);
  background: #0d1011;
  border: 1px solid #354042;
  border-radius: 10px;
  padding: 11px;
  min-height: 43px;
}
input[type="month"] { max-width: 170px; }
.bar-track {
  height: 8px;
  background: #303838;
  border-radius: 99px;
  overflow: hidden;
  margin: 9px 0;
}
.bar-fill {
  height: 100%;
  background: var(--green);
  border-radius: 99px;
}
.tag {
  font-size: 11px;
  color: var(--green);
  background: #1a352a;
  border-radius: 20px;
  padding: 5px 9px;
  white-space: nowrap;
}
.notice {
  padding: 13px 15px;
  background: #14241e;
  border: 1px solid #244735;
  color: #b4d6c3;
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 13px;
}
.graph {
  height: 160px;
  display: flex;
  align-items: end;
  gap: 12px;
  margin: 20px 0 29px;
  border-bottom: 1px solid var(--border);
}
.bar-group {
  position: relative;
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 4px;
  flex: 1;
  height: 100%;
}
.chartbar {
  width: 32%;
  min-width: 6px;
  border-radius: 5px 5px 0 0;
}
.bar-label {
  position: absolute;
  top: calc(100% + 6px);
  font-size: 10px;
  color: var(--muted);
}
.legend {
  font-size: 12px;
  color: var(--muted);
  margin-top: 7px;
}
.empty { color: var(--muted); padding: 8px 0; }
.bottomnav { display: none; }

@media(max-width:780px) {
  .layout {
    grid-template-columns: 1fr;
    padding: 19px 14px 100px;
  }
  .layout>nav { display: none; }
  .head { padding: 14px; }
  .head button { display: inline-flex; }
  .cards { grid-template-columns: 1fr 1fr; }
  .cards .main-card { grid-column: span 2; }
  .cols { grid-template-columns: 1fr; }
  .bottomnav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 5;
    background: #101415f8;
    border-top: 1px solid var(--border);
    padding: 7px 3px max(9px, env(safe-area-inset-bottom));
    justify-content: space-around;
  }
  .bottomnav button {
    background: transparent;
    color: var(--muted);
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    min-width: 0;
    padding: 4px;
  }
  .bottomnav button.active { color: var(--green); }
  .bottomnav .icon { width: 22px; height: 22px; }
  h1 { font-size: 24px; }
}
@media(max-width:460px) {
  .formgrid { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .metric { font-size: 22px; }
  .toprow { align-items: start; }
  .toprow input { max-width: 140px; }
  .brand { font-size: 18px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORE = 'gestion-argent-v2';
const LEGACY = 'monargent-v1';

const CATS = {
  food:'Nourriture',
  outings:'Sorties',
  transport:'Transport',
  shopping:'Shopping',
  sport:'Sport',
  projects:'Achats / projets',
  other:'Autres'
};

const NAV = [
  ['home','home','Accueil'],
  ['operations','receipt','Opérations'],
  ['budgets','chart','Budgets'],
  ['projects','target','Projets'],
  ['recurring','repeat','Récurrents'],
  ['settings','settings','Paramètres']
];

const ICONS = {
  home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-7h6v7"/>',
  receipt:'<path d="M4 3h16v18l-4-2-4 2-4-2-4 2V3z"/><path d="M8 8h8M8 12h8M8 16h4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20V7"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  repeat:'<path d="M20 7h-12a4 4 0 0 0-4 4v1M4 7l4-4m-4 4 4 4M4 17h12a4 4 0 0 0 4-4v-1m0 5-4 4m4-4-4-4"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M10 2h4l.7 2.5 2 .9 2.3-1.1 2.5 3-1.5 2 .4 2.2 2 1.5-1 3.6-2.5.2-1.4 1.6.2 2.5-3.7 1.1-1.5-2-2.2-.3-2 1.5-3.2-2.4 1.1-2.3-.8-2-2.5-.7V10l2.5-.7.8-2L5.1 5l3.2-2.4 2 1.5L10 2z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  down:'<path d="M12 4v16m-6-6 6 6 6-6"/>',
  up:'<path d="M12 20V4m-6 6 6-6 6 6"/>',
  wallet:'<rect x="2" y="5" width="20" height="15" rx="3"/><path d="M2 9h20M17 15h1"/>',
  transfer:'<path d="M4 8h16m-5-4 5 4-5 4M20 16H4m5-4-5 4 5 4"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>'
};

function icon(k,size=20) {
  return `<svg class="icon" width="${size}" height="${size}"
    viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.8" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true">
    ${ICONS[k]||ICONS.wallet}</svg>`;
}

const initial = () => ({
  accounts:[
    {id:'bank',name:'Compte bancaire',opening:0},
    {id:'savings',name:'Épargne',opening:0}
  ],
  transactions:[],
  projects:[],
  reserves:[],
  budgets:{},
  recurring:[],
  monthlyEstimate:0
});

const parse = s => {
  try { return JSON.parse(s); }
  catch { return null; }
};

function migrate(old) {
  const d = initial();

  if(!old || !Array.isArray(old.accounts)
     || !Array.isArray(old.transactions)) return d;

  for(const k of Object.keys(d))
    if(old[k]!=null) d[k]=old[k];

  for(const k of ['projects','reserves','recurring'])
    if(!Array.isArray(d[k])) d[k]=[];

  if(!d.budgets || typeof d.budgets!=='object')
    d.budgets={};

  d.projects=d.projects.map(p=>({
    ...p,
    ruleType:p.ruleType||'percent',
    ruleValue:Number(p.ruleValue??p.rate??0)
  }));

  // Regrouper l'ancien compte Espèces dans le compte bancaire.
  const cash=d.accounts.filter(a=>
    a.id==='cash'||a.name?.toLowerCase()==='espèces'
  );

  if(cash.length) {
    let bank=d.accounts.find(a=>a.id==='bank')
      || d.accounts.find(a=>!cash.includes(a));

    if(!bank) {
      bank={id:'bank',name:'Compte bancaire',opening:0};
      d.accounts.push(bank);
    }

    bank.opening=Number(bank.opening||0)
      +cash.reduce((s,a)=>s+Number(a.opening||0),0);

    const cashIds=new Set(cash.map(a=>a.id));

    for(const t of d.transactions) {
      for(const k of ['accountId','fromId','toId'])
        if(cashIds.has(t[k])) t[k]=bank.id;
    }

    for(const rule of d.recurring)
      if(cashIds.has(rule.accountId))
        rule.accountId=bank.id;

    d.accounts=d.accounts.filter(a=>!cashIds.has(a.id));
  }

  if(!d.accounts.length) d.accounts=initial().accounts;
  return d;
}

let data=migrate(
  parse(localStorage.getItem(STORE))
  ||parse(localStorage.getItem(LEGACY))
);

let page='home';
let month=now().slice(0,7);
let kind='expense';
let editTx=null;
let editProject=null;
let editRecurring=null;
let query='';
let kindFilter='all';

try {
  localStorage.setItem(STORE,JSON.stringify(data));
} catch {}

function now() {
  const x=new Date();
  const p=n=>String(n).padStart(2,'0');
  return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`;
}

function uid() {
  return crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now()+'-'+Math.random();
}

const num=x=>Number(String(x??'').replace(',','.'));
const round=x=>Math.round((x+Number.EPSILON)*100)/100;
const money=x=>Number(x||0).toLocaleString('fr-CH',{
  style:'currency',currency:'CHF'
});
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

function save() {
  try {
    localStorage.setItem(STORE,JSON.stringify(data));
  } catch {
    alert('Impossible d’enregistrer sur cet appareil.');
  }
  render();
}

function balance(a) {
  let amount=Number(
    data.accounts.find(x=>x.id===a)?.opening||0
  );

  for(const t of data.transactions) {
    if(t.kind==='income'&&t.accountId===a)
      amount+=t.amount;

    if(t.kind==='expense'&&t.accountId===a)
      amount-=t.amount;

    if(t.kind==='transfer') {
      if(t.fromId===a) amount-=t.amount;
      if(t.toId===a) amount+=t.amount;
    }
  }

  return round(amount);
}

const total=()=>round(
  data.accounts.reduce((s,a)=>s+balance(a.id),0)
);

const reserved=id=>round(
  data.reserves.filter(x=>x.projectId===id)
    .reduce((s,x)=>s+Number(x.amount),0)
);

const reservedTotal=()=>round(
  data.projects.reduce((s,p)=>s+reserved(p.id),0)
);

const available=()=>round(total()-reservedTotal());

const accountName=id=>
  data.accounts.find(a=>a.id===id)?.name||'Compte';

const forMonth=(m=month)=>
  data.transactions.filter(t=>t.date?.startsWith(m));

const sum=(type,m=month)=>round(
  forMonth(m).filter(t=>t.kind===type)
    .reduce((s,t)=>s+t.amount,0)
);

const categorySum=(c,m=month)=>round(
  forMonth(m)
    .filter(t=>t.kind==='expense'&&t.category===c)
    .reduce((s,t)=>s+t.amount,0)
);

const sortTx=(a,b)=>b.date.localeCompare(a.date)
  ||String(b.id).localeCompare(String(a.id));

const opts=(arr,selected)=>arr.map(([id,label])=>`
  <option value="${escapeHtml(id)}"
    ${String(id)===String(selected)?'selected':''}>
    ${escapeHtml(label)}
  </option>`).join('');

const accountOpts=selected=>opts(
  data.accounts.map(a=>[a.id,a.name]),selected
);

const field=(label,name,value='',type='text',extra='')=>`
  <div class="field">
    <label for="f_${name}">${escapeHtml(label)}</label>
    <input id="f_${name}" name="${name}"
      value="${escapeHtml(value)}" type="${type}" ${extra}>
  </div>`;

const select=(label,name,arr,selected)=>`
  <div class="field">
    <label for="f_${name}">${escapeHtml(label)}</label>
    <select id="f_${name}" name="${name}">
      ${opts(arr,selected)}
    </select>
  </div>`;

function heading(name,description='',monthSelect=false) {
  return `<div class="toprow">
    <div>
      <h1>${name}</h1>
      <div class="caption">${description}</div>
    </div>
    ${monthSelect?`
      <input id="month" type="month" value="${month}"
        aria-label="Choisir un mois">`:''}
  </div>`;
}

function txRows(list,actions=false) {
  if(!list.length)
    return '<div class="empty">Aucune opération pour le moment.</div>';

  return list.map(t=>`
    <div class="line row">
      <div class="min0 truncate">
        <strong>${escapeHtml(t.description||(
          t.kind==='transfer'?'Transfert':
          t.kind==='income'?'Revenu':
          CATS[t.category]||'Dépense'
        ))}</strong>

        <div class="caption">
          ${escapeHtml(t.date)} ·
          ${escapeHtml(
            t.kind==='transfer'
              ?accountName(t.fromId)+' → '+accountName(t.toId)
              :accountName(t.accountId)
          )}
        </div>

        ${actions?`
          <div class="buttons">
            <button class="btn small"
              data-edit-tx="${escapeHtml(t.id)}">Modifier</button>
            <button class="btn small red-btn"
              data-del-tx="${escapeHtml(t.id)}">Supprimer</button>
            ${t.kind==='income'?`
              <button class="btn small"
                data-allocate="${escapeHtml(t.id)}">Répartir</button>
            `:''}
          </div>`:''}
      </div>

      <strong class="${
        t.kind==='expense'?'red':
        t.kind==='income'?'green':''
      }">
        ${t.kind==='income'?'+':t.kind==='expense'?'−':''}
        ${money(t.amount)}
      </strong>
    </div>`).join('');
}

function accountRows() {
  return data.accounts.map(a=>`
    <div class="line row">
      <span>${escapeHtml(a.name)}</span>
      <strong>${money(balance(a.id))}</strong>
    </div>`).join('');
}

function home() {
  const months=Array.from({length:6},(_,i)=>{
    const d=new Date(
      +month.slice(0,4),
      +month.slice(5,7)-1+i-5,1
    );
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });

  const max=Math.max(
    1,...months.flatMap(m=>[sum('income',m),sum('expense',m)])
  );

  return `
    ${heading('Vue d’ensemble','Ton argent en un coup d’œil',true)}

    <div class="cards">
      <section class="card main-card">
        <div class="caption">Solde total</div>
        <div class="metric">${money(total())}</div>
        <div class="caption">Tous tes comptes</div>
      </section>
      <section class="card">
        <div class="caption">Disponible</div>
        <div class="metric">${money(available())}</div>
        <div class="caption">Hors projets</div>
      </section>
      <section class="card">
        <div class="caption">Pour tes projets</div>
        <div class="metric green">${money(reservedTotal())}</div>
        <div class="caption">Argent réservé</div>
      </section>
    </div>

    <div class="cols">
      <section class="card">
        <h2>Ce mois-ci</h2>
        <div class="line row">
          <span>${icon('down')} Revenus</span>
          <strong class="green">+ ${money(sum('income'))}</strong>
        </div>
        <div class="line row">
          <span>${icon('up')} Dépenses</span>
          <strong class="red">− ${money(sum('expense'))}</strong>
        </div>
        <div class="line row">
          <strong>Différence</strong>
          <strong>${money(sum('income')-sum('expense'))}</strong>
        </div>
      </section>
      <section class="card">
        <h2>Mes comptes</h2>
        ${accountRows()}
      </section>
    </div>

    <div class="cols">
      <section class="card">
        <h2>Évolution sur 6 mois</h2>
        <div class="graph">
          ${months.map(m=>`
            <div class="bar-group">
              <div class="chartbar"
                style="height:${100*sum('income',m)/max}%;
                  background:var(--green)"
                title="Revenus : ${money(sum('income',m))}">
              </div>
              <div class="chartbar"
                style="height:${100*sum('expense',m)/max}%;
                  background:var(--red)"
                title="Dépenses : ${money(sum('expense',m))}">
              </div>
              <div class="bar-label">${m.slice(5)}</div>
            </div>`).join('')}
        </div>
        <div class="legend">
          <span class="green">●</span> Revenus
          &nbsp;
          <span class="red">●</span> Dépenses
        </div>
      </section>

      <section class="card">
        <h2>Dépenses par catégorie</h2>
        ${Object.entries(CATS)
          .filter(([c])=>categorySum(c)>0)
          .map(([c,label])=>`
            <div class="line">
              <div class="row">
                <span>${label}</span>
                <strong>${money(categorySum(c))}</strong>
              </div>
              <div class="bar-track">
                <div class="bar-fill"
                  style="background:var(--red);
                  width:${100*categorySum(c)/(sum('expense')||1)}%">
                </div>
              </div>
            </div>`).join('')||
          '<div class="empty">Aucune dépense ce mois.</div>'}
      </section>
    </div>

    <div class="cols">
      <section class="card">
        <div class="row">
          <h2>Dernières opérations</h2>
          <button class="btn small" data-page="operations">Voir tout</button>
        </div>
        ${txRows([...data.transactions].sort(sortTx).slice(0,5))}
      </section>

      <section class="card">
        <div class="row">
          <h2>Projets</h2>
          <button class="btn small" data-page="projects">Voir tout</button>
        </div>
        ${data.projects.map(p=>`
          <div class="line">
            <div class="row">
              <strong>${escapeHtml(p.name)}</strong>
              <span class="caption">
                ${money(reserved(p.id))} / ${money(p.target)}
              </span>
            </div>
            <div class="bar-track">
              <div class="bar-fill"
                style="width:${Math.min(100,100*reserved(p.id)/p.target)}%">
              </div>
            </div>
          </div>`).join('')||

function forecast(p) {
  const left=Math.max(0,p.target-reserved(p.id));
  if(left<=0) return 'Objectif atteint.';

  const incomes=[...data.transactions]
    .filter(t=>t.kind==='income')
    .sort(sortTx).slice(0,8);

  const mean=incomes.length
    ?incomes.reduce((s,t)=>s+t.amount,0)/incomes.length
    :0;

  const step=p.ruleType==='fixed'
    ?p.ruleValue
    :round(mean*p.ruleValue/100);

  let txt=step>0
    ?`Environ ${Math.ceil(left/step)} revenu(s) supplémentaire(s) similaires.`
    :'Pas assez de données pour estimer le nombre de revenus.';

  if(Number(data.monthlyEstimate)>0
    &&p.ruleType==='percent'&&p.ruleValue>0) {
    const monthly=data.monthlyEstimate*p.ruleValue/100;
    txt+=` À revenu moyen constant : environ ${Math.ceil(left/monthly)} mois.`;
  }
  return txt;
}

function due(rule) {
  if(rule.paused||!rule.startDate) return [];

  const out=[];
  const start=new Date(rule.startDate+'T12:00:00');
  const today=new Date(now()+'T12:00:00');

  for(let i=0;i<500;i++) {
    let date;

    if(rule.frequency==='weekly') {
      date=new Date(start.getFullYear(),
        start.getMonth(),start.getDate()+7*i,12);
    } else if(rule.frequency==='yearly') {
      const y=start.getFullYear()+i;
      const m=start.getMonth();
      date=new Date(y,m,Math.min(
        start.getDate(),
        new Date(y,m+1,0).getDate()
      ),12);
    } else {
      const y=start.getFullYear();
      const m=start.getMonth()+i;
      const days=new Date(y,m+1,0).getDate();
      date=new Date(y,m,Math.min(start.getDate(),days),12);
    }

    if(date>today) break;

    const day=`${date.getFullYear()}-${
      String(date.getMonth()+1).padStart(2,'0')
    }-${String(date.getDate()).padStart(2,'0')}`;

    if(!data.transactions.some(t=>
      t.recurringId===rule.id&&t.occurrenceDate===day
    )) out.push(day);
  }

  return out;
}

function allocate(txId) {
  const t=data.transactions.find(x=>x.id===txId);
  if(!t||t.kind!=='income') return;

  if(data.reserves.some(x=>x.sourceTx===txId))
    return alert(
      'Ce revenu a déjà été réparti. Tu peux ajouter une réserve manuellement.'
    );

  let freeRoom=Math.max(0,Math.min(t.amount,available()));
  const proposals=[];

  for(const p of data.projects) {
    const remaining=Math.max(0,p.target-reserved(p.id));
    const desired=p.ruleType==='fixed'
      ?Number(p.ruleValue)
      :round(t.amount*p.ruleValue/100);

    const amount=round(
      Math.max(0,Math.min(desired,remaining,freeRoom))
    );

    if(amount>0) {
      proposals.push({p,amount});
      freeRoom=round(freeRoom-amount);
    }
  }

  if(!proposals.length) return;

  if(confirm(
    'Réserver une partie de ce revenu ?\n\n'
    +proposals.map(x=>
      x.p.name+' : '+money(x.amount)
    ).join('\n')
  )) {
    for(const x of proposals)
      data.reserves.push({
        id:uid(),
        projectId:x.p.id,
        amount:x.amount,
        date:t.date,
        sourceTx:t.id
      });
    save();
  }
}

function txSubmit(form) {
  const f=new FormData(form);
  const amount=round(num(f.get('amount')));
  const date=String(f.get('date')||'');
  const chosen=String(f.get('kind'));

  if(!Number.isFinite(amount)||amount<=0||!date)
    return alert('Montant ou date invalide.');

  const old=data.transactions.find(t=>t.id===editTx);

  const t={
    id:old?.id||uid(),
    kind:chosen,
    amount,date,
    description:String(f.get('description')||'').trim()
  };

  if(chosen==='transfer') {
    t.fromId=f.get('fromId');
    t.toId=f.get('toId');
    if(t.fromId===t.toId)
      return alert('Choisis deux comptes différents.');
  } else {
    t.accountId=f.get('accountId');
    if(chosen==='expense')
      t.category=f.get('category');
  }

  if(old) {
    t.recurringId=old.recurringId;
    t.occurrenceDate=old.occurrenceDate;

    if(old.kind!==chosen||old.amount!==amount||old.date!==date)
      data.reserves=data.reserves.filter(x=>x.sourceTx!==old.id);

    data.transactions=data.transactions.map(x=>
      x.id===old.id?t:x
    );
  } else {
    data.transactions.push(t);
  }

  editTx=null;
  kind=chosen;
  save();

  if(!old&&chosen==='income') allocate(t.id);
}

function onSubmit(event) {
  event.preventDefault();

  const form=event.target;
  const f=new FormData(form);

  if(form.id==='txForm')
    return txSubmit(form);

  if(form.id==='budgetForm') {
    for(const c of Object.keys(CATS)) {
      const v=num(f.get('budget_'+c)||0);

      if(!Number.isFinite(v)||v<0)
        return alert('Budget invalide.');

      data.budgets[c]=round(v);
    }
    return save();
  }

  if(form.id==='projectForm') {
    const name=String(f.get('name')||'').trim();
    const target=round(num(f.get('target')));
    const ruleType=f.get('ruleType');
    const ruleValue=round(num(f.get('ruleValue')));

    if(!name||!Number.isFinite(target)||target<=0
      ||!Number.isFinite(ruleValue)||ruleValue<0
      ||(ruleType==='percent'&&ruleValue>100))
      return alert('Projet invalide.');

    const others=data.projects
      .filter(x=>x.id!==editProject&&x.ruleType==='percent')
      .reduce((s,x)=>s+Number(x.ruleValue),0);

    if(ruleType==='percent'&&others+ruleValue>100.001)
      return alert('La somme des pourcentages dépasse 100 %.');

    const item={
      id:editProject||uid(),
      name,target,ruleType,ruleValue,
      priority:f.get('priority'),
      deadline:f.get('deadline')
    };

    if(editProject)
      data.projects=data.projects.map(p=>
        p.id===editProject?item:p
      );
    else
      data.projects.push(item);

    editProject=null;
    return save();
  }

  if(form.id==='recForm') {
    const description=String(f.get('description')||'').trim();
    const amount=round(num(f.get('amount')));

    if(!description||!Number.isFinite(amount)||amount<=0)
      return alert('Récurrence invalide.');

    const old=data.recurring.find(x=>x.id===editRecurring);

    const item={
      id:editRecurring||uid(),
      description,amount,
      kind:f.get('kind'),
      frequency:f.get('frequency'),
      startDate:f.get('startDate'),
      accountId:f.get('accountId'),
      category:f.get('category'),
      paused:old?.paused||false
    };

    if(editRecurring)
      data.recurring=data.recurring.map(x=>
        x.id===editRecurring?item:x
      );
    else
      data.recurring.push(item);

    editRecurring=null;
    return save();
  }

  if(form.id==='accountForm') {
    const name=String(f.get('name')||'').trim();
    const opening=round(num(f.get('opening')));

    if(!name||!Number.isFinite(opening))
      return alert('Compte invalide.');

    data.accounts.push({
      id:uid(),name,opening
    });
    return save();
  }

  if(form.id==='estimateForm') {
    const amount=round(num(f.get('estimate')));

    if(!Number.isFinite(amount)||amount<0)
      return alert('Montant invalide.');

    data.monthlyEstimate=amount;
    return save();
  }
}

function onClick(event) {
  const b=event.target.closest('button');
  if(!b) return;

  if(b.dataset.page)
    return go(b.dataset.page);

  if(b.hasAttribute('data-cancel')) {
    editTx=editProject=editRecurring=null;
    return render();
  }

  if(b.dataset.editTx) {
    editTx=b.dataset.editTx;
    kind=data.transactions.find(t=>t.id===editTx)?.kind||'expense';
    page='operations';
    return render();
  }

  if(b.dataset.delTx) {
    if(!confirm('Supprimer cette opération ?')) return;

    data.transactions=data.transactions.filter(t=>
      t.id!==b.dataset.delTx
    );
    data.reserves=data.reserves.filter(r=>
      r.sourceTx!==b.dataset.delTx
    );
    return save();
  }

  if(b.dataset.allocate)
    return allocate(b.dataset.allocate);

  if(b.dataset.project) {
    const p=data.projects.find(x=>x.id===b.dataset.id);
    if(!p) return;

    const action=b.dataset.project;

    if(action==='edit') {
      editProject=p.id;
      page='projects';
      return render();
    }

    if(action==='delete') {
      if(reserved(p.id)>0)
        return alert('Libère d’abord tout l’argent réservé.');

      if(!confirm('Supprimer le projet ?')) return;

      data.projects=data.projects.filter(x=>x.id!==p.id);
      data.reserves=data.reserves.filter(x=>
        x.projectId!==p.id
      );
      return save();
    }

    const max=action==='add'
      ?Math.max(0,Math.min(
        available(),p.target-reserved(p.id)
      ))
      :reserved(p.id);

    const text=prompt(
      `Montant à ${action==='add'?'réserver':'libérer'} (max. ${money(max)})`,
      '20'
    );

    if(text===null) return;

    const amount=round(num(text));

    if(!Number.isFinite(amount)||amount<=0||amount>max+.001)
      return alert('Montant invalide.');

    data.reserves.push({
      id:uid(),
      projectId:p.id,
      amount:action==='add'?amount:-amount,
      date:now()
    });

    return save();
  }

  if(b.dataset.rec) {
    const r=data.recurring.find(x=>x.id===b.dataset.id);
    if(!r) return;

    const action=b.dataset.rec;

    if(action==='edit') {
      editRecurring=r.id;
      page='recurring';
      return render();
    }

    if(action==='pause') {
      r.paused=!r.paused;
      return save();
    }

    if(action==='delete') {
      if(!confirm(
        'Supprimer la récurrence ? Les opérations passées sont conservées.'
      )) return;

      data.recurring=data.recurring.filter(x=>x.id!==r.id);
      return save();
    }

    if(action==='record') {
      const dates=due(r);
      if(!dates.length) return;

      if(!confirm(
        `Enregistrer ${dates.length} échéance(s), pour ${money(dates.length*r.amount)} ?`
      )) return;

      for(const date of dates)
        data.transactions.push({
          id:uid(),
          kind:r.kind,
          amount:r.amount,
          date,
          description:r.description,
          accountId:r.accountId,
          category:r.category,
          recurringId:r.id,
          occurrenceDate:date
        });

      return save();
    }
  }

  if(b.dataset.account) {
    const a=data.accounts.find(x=>x.id===b.dataset.account);
    if(!a) return;

    const name=prompt('Nom du compte',a.name);
    if(name===null) return;

    const value=prompt('Solde de départ',a.opening);
    if(value===null) return;

    const amount=round(num(value));

    if(!name.trim()||!Number.isFinite(amount))
      return alert('Valeur invalide.');

    a.name=name.trim();
    a.opening=amount;
    return save();
  }
}

function onChange(event) {
  const el=event.target;

  if(el.id==='month') {
    month=el.value;
    return render();
  }

  if(el.name==='kind'&&el.closest('#txForm')) {
    const form=el.form;

    const draft={
      amount:form.elements.amount.value,
      date:form.elements.date.value,
      description:form.elements.description.value
    };

    kind=el.value;
    render();

    const newForm=document.getElementById('txForm');
    for(const k of Object.keys(draft))
      newForm.elements[k].value=draft[k];

    return;
  }

  if(el.name==='filter') {
    kindFilter=el.value;
    return render();
  }
}

function onInput(event) {
  if(event.target.name==='search') {
    query=event.target.value;
    const pos=event.target.selectionStart;

    render();

    const input=document.querySelector('[name="search"]');
    input?.focus();
    input?.setSelectionRange(pos,pos);
  }
}

document.addEventListener('submit',onSubmit);
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);

render();
</script>
</body>
</html>
