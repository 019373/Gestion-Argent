
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090b0c">
<title>Gestion-Argent</title>

<link rel="icon" type="image/svg+xml"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23090b0c'/%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M14 43 27 32 36 37 50 20m-10 0h10v10' fill='none' stroke='white' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
:root {
  color-scheme: dark;
  --bg: #090b0c;
  --card: #141819;
  --card2: #1c2223;
  --border: #2a3435;
  --text: #f4f6f5;
  --muted: #9ba7a5;
  --green: #39c98b;
  --red: #f16a72;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
}

button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }

button:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

header {
  position: sticky;
  top: 0;
  background: #090b0cf2;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 3;
}

.head {
  max-width: 1110px;
  margin: auto;
  padding: 15px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.brand-logo {
  width: 35px;
  height: 35px;
  flex: none;
}

.head button { display: none; }

.layout {
  max-width: 1110px;
  margin: auto;
  display: grid;
  grid-template-columns: 195px minmax(0, 1fr);
  gap: 29px;
  padding: 29px 22px 90px;
}

nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
  position: sticky;
  top: 90px;
  align-self: start;
}

nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  background: transparent;
  border: 0;
  color: var(--muted);
  border-radius: 12px;
  text-align: left;
  padding: 12px;
  font-weight: 600;
}

nav button.active {
  background: #163328;
  color: var(--green);
}

.icon {
  display: inline-block;
  width: 20px;
  height: 20px;
  vertical-align: middle;
  flex-shrink: 0;
}

main { min-width: 0; }

h1 {
  font-size: 27px;
  letter-spacing: -.7px;
  margin: 0;
}

h2 { font-size: 16px; margin: 0 0 15px; }
h3 { font-size: 14px; margin: 0 0 8px; }

p {
  color: var(--muted);
  margin: 8px 0 14px;
  line-height: 1.6;
}

.caption {
  font-size: 12px;
  color: var(--muted);
}

.toprow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 23px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.cols {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.card {
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  margin-bottom: 14px;
  min-width: 0;
}

.main-card {
  background: linear-gradient(135deg, #153c2f, #13231e 85%);
  border-color: #285340;
}

.metric {
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -.6px;
  margin-top: 6px;
  overflow-wrap: anywhere;
}

.green { color: var(--green); }
.red { color: var(--red); }
.muted { color: var(--muted); }

.line {
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}

.line:last-child { border: 0; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.min0 {
  min-width: 0;
  overflow-wrap: anywhere;
}

.btn {
  border: 1px solid var(--border);
  background: var(--card2);
  color: var(--text);
  border-radius: 10px;
  padding: 10px 13px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: 600;
  text-align: center;
}

.btn-primary {
  background: var(--green);
  border-color: var(--green);
  color: #052316;
}

.btn-red { color: var(--red); }

.btn-small {
  font-size: 12px;
  padding: 6px 10px;
}

.buttons {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-top: 13px;
}

.formgrid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.field { min-width: 0; }

.field label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 5px;
}

/* Champs uniformes et prévention du zoom Safari */
input, select {
  display: block;
  width: 100%;
  min-width: 0;
  height: 46px;
  min-height: 46px;
  padding: 10px 11px;
  line-height: normal;
  font-size: 16px;
  color: var(--text);
  background: #0d1011;
  border: 1px solid #354042;
  border-radius: 10px;
  box-sizing: border-box;
}

input[type="date"],
input[type="month"] {
  display: block;
  height: 46px;
  min-height: 46px;
  padding: 10px 11px;
  border-radius: 10px;
}

input[type="date"]::-webkit-date-and-time-value,
input[type="month"]::-webkit-date-and-time-value {
  text-align: left;
  min-height: 22px;
}

input[type="month"] { max-width: 170px; }

.track {
  height: 8px;
  background: #303838;
  border-radius: 99px;
  overflow: hidden;
  margin: 9px 0;
}

.fill {
  height: 100%;
  background: var(--green);
  border-radius: 99px;
}

.tag {
  font-size: 11px;
  color: var(--green);
  background: #1a352a;
  padding: 5px 9px;
  border-radius: 99px;
  white-space: nowrap;
}

.notice {
  padding: 13px 15px;
  background: #14241e;
  border: 1px solid #244735;
  color: #b4d6c3;
  border-radius: 12px;
  margin-bottom: 14px;
  font-size: 13px;
}

.graph {
  height: 160px;
  display: flex;
  align-items: end;
  gap: 12px;
  margin: 20px 0 29px;
  border-bottom: 1px solid var(--border);
}

.bar-group {
  position: relative;
  display: flex;
  align-items: end;
  justify-content: center;
  gap: 4px;
  flex: 1;
  height: 100%;
}

.chartbar {
  width: 32%;
  min-width: 6px;
  border-radius: 5px 5px 0 0;
}

.bar-label {
  position: absolute;
  top: calc(100% + 6px);
  font-size: 10px;
  color: var(--muted);
}

.legend {
  font-size: 12px;
  color: var(--muted);
  margin-top: 7px;
}

.empty {
  color: var(--muted);
  padding: 10px 0;
}

.bottomnav { display: none; }

/* Règle budgétaire */
.allocation {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin: 15px 0;
}

.allocation > div {
  padding: 13px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card2);
}

.allocation strong {
  display: block;
  font-size: 19px;
  margin: 5px 0;
}

.distribution {
  display: flex;
  overflow: hidden;
  border-radius: 99px;
  height: 11px;
  margin: 18px 0;
}

.distribution > div { height: 100%; }

.section-sep {
  height: 1px;
  background: var(--border);
  margin: 20px 0;
}

.section-number {
  font-size: 12px;
  color: var(--green);
  font-weight: 700;
  letter-spacing: .05em;
}

.read-only {
  border-left: 3px solid var(--green);
  padding: 10px 13px;
  background: var(--card2);
  border-radius: 8px;
  margin-bottom: 16px;
  color: var(--muted);
}

/* Téléphone */
@media(max-width:780px) {
  .layout {
    grid-template-columns: 1fr;
    padding: 18px 14px 110px;
  }

  .layout > nav { display: none; }
  .head { padding: 12px 14px; }
  .head button { display: inline-flex; }

  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .cards .main-card { grid-column: span 2; }
  .cols { grid-template-columns: 1fr; }

  .bottomnav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 5;
    background: #101415f8;
    border-top: 1px solid var(--border);
    padding: 7px 3px max(9px, env(safe-area-inset-bottom));
    justify-content: space-around;
  }

  .bottomnav button {
    background: transparent;
    color: var(--muted);
    border: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    padding: 4px;
    min-width: 0;
  }

  .bottomnav button.active { color: var(--green); }

  .bottomnav .icon {
    width: 22px;
    height: 22px;
  }

  h1 { font-size: 24px; }
}

@media(max-width:460px) {
  .formgrid { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .metric { font-size: 22px; }
  .toprow { align-items: flex-start; }
  .toprow input { max-width: 143px; }
  .brand { font-size: 18px; }
  .allocation { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
/* ==============================
   DONNÉES ET CONFIGURATION
============================== */

const STORE = 'gestion-argent-v2';
const LEGACY = 'monargent-v1';

const CATS = {
  food: 'Nourriture',
  outings: 'Sorties',
  transport: 'Transport',
  shopping: 'Shopping',
  sport: 'Sport',
  projects: 'Achats / projets',
  other: 'Autres'
};

const NAV = [
  ['home', 'home', 'Accueil'],
  ['operations', 'receipt', 'Opérations'],
  ['budgets', 'chart', 'Budgets'],
  ['projects', 'target', 'Projets'],
  ['recurring', 'repeat', 'Récurrents'],
  ['settings', 'settings', 'Paramètres']
];

/* Icônes SVG */

const ICONS = {
  home:
    '<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>' +
    '<path d="M9 21v-7h6v7"/>',

  receipt:
    '<path d="M4 3h16v18l-4-2-4 2-4-2-4 2V3z"/>' +
    '<path d="M8 8h8M8 12h8M8 16h4"/>',

  chart:
    '<path d="M4 20V10M10 20V4M16 20v-8M22 20V7"/>',

  target:
    '<circle cx="12" cy="12" r="9"/>' +
    '<circle cx="12" cy="12" r="5"/>' +
    '<circle cx="12" cy="12" r="1"/>',

  repeat:
    '<path d="M4 9V7a3 3 0 0 1 3-3h13"/>' +
    '<path d="m16 1 4 3-4 3"/>' +
    '<path d="M20 15v2a3 3 0 0 1-3 3H4"/>' +
    '<path d="m8 17-4 3 4 3"/>',

  settings:
    '<path d="M12 3a2 2 0 0 1 2 2l1 1 2-.2 1.8 2-1 2 .3 2 1.9 1v3l-2 1-.4 2 1 1.9-2.1 2-2-.9-1.8.5-1 2h-3l-1-2-2-.5-2 .9-2-2 1-2-.5-1.8-2-1v-3l2-1 .5-2-1-2 2-2 2 .9 2-.4 1-2z"/>' +
    '<circle cx="12" cy="13" r="3"/>',

  plus:
    '<path d="M12 5v14M5 12h14"/>',

  down:
    '<path d="M12 4v16m-6-6 6 6 6-6"/>',

  up:
    '<path d="M12 20V4m-6 6 6-6 6 6"/>',

  back:
    '<path d="m15 18-6-6 6-6"/>' +
    '<path d="M9 12h12"/>',

  info:
    '<circle cx="12" cy="12" r="9"/>' +
    '<path d="M12 11v5"/>' +
    '<path d="M12 8h.01"/>'
};

function icon(k) {
  return `
    <svg class="icon" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">
      ${ICONS[k] || ICONS.home}
    </svg>`;
}

function brandLogo() {
  return `
    <svg class="brand-logo" viewBox="0 0 64 64"
      aria-hidden="true">
      <rect width="64" height="64" rx="16"
        fill="#090b0c"/>
      <rect x="2" y="2" width="60" height="60"
        rx="14" fill="none"
        stroke="#ffffff" stroke-width="2"/>
      <path d="M14 43 27 32 36 37 50 20m-10 0h10v10"
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>`;
}

/* Répartition par défaut */

function defaultRule() {
  return {
    needs: {
      name: 'Besoins',
      percent: 50,
      description: 'Nourriture, transport et dépenses indispensables.'
    },
    wants: {
      name: 'Envies',
      percent: 30,
      description: 'Sorties, loisirs et achats personnels.'
    },
    savings: {
      name: 'Épargne',
      percent: 20,
      description: 'Projets et réserve pour les imprévus.'
    }
  };
}

function initial() {
  return {
    accounts: [
      {id:'bank', name:'Compte bancaire', opening:0},
      {id:'savings', name:'Épargne', opening:0}
    ],
    transactions: [],
    projects: [],
    reserves: [],
    budgets: {},
    recurring: [],
    monthlyEstimate: 0,
    allocationRule: defaultRule()
  };
}

function parse(s) {
  try { return JSON.parse(s); }
  catch { return null; }
}

/* Compatibilité avec les versions précédentes */

function migrate(raw) {
  const d = initial();

  if(!raw ||
     !Array.isArray(raw.accounts) ||
     !Array.isArray(raw.transactions)) {
    return d;
  }

  for(const k of Object.keys(d)) {
    if(raw[k] != null) d[k] = raw[k];
  }

  for(const k of ['projects','reserves','recurring']) {
    if(!Array.isArray(d[k])) d[k] = [];
  }

  if(!d.budgets || typeof d.budgets !== 'object') {
    d.budgets = {};
  }

  const defaults = defaultRule();

  for(const k of Object.keys(defaults)) {
    d.allocationRule[k] = {
      ...defaults[k],
      ...(d.allocationRule?.[k] || {})
    };
  }

  d.projects = d.projects.map(p => ({
    ...p,
    ruleType: p.ruleType || 'percent',
    ruleValue: Number(p.ruleValue ?? p.rate ?? 0)
  }));

  /* Ancien compte Espèces : intégré au compte bancaire */

  const cash = d.accounts.filter(a =>
    a.id === 'cash' ||
    a.name?.toLowerCase() === 'espèces'
  );

  if(cash.length) {
    let bank =
      d.accounts.find(a => a.id === 'bank') ||
      d.accounts.find(a => !cash.includes(a));

    if(!bank) {
      bank = {
        id:'bank',
        name:'Compte bancaire',
        opening:0
      };
      d.accounts.push(bank);
    }

    bank.opening =
      Number(bank.opening || 0) +
      cash.reduce((s,a) => s + Number(a.opening || 0),0);

    const ids = new Set(cash.map(a => a.id));

    for(const t of d.transactions) {
      for(const key of ['accountId','fromId','toId']) {
        if(ids.has(t[key])) t[key] = bank.id;
      }
    }

    for(const r of d.recurring) {
      if(ids.has(r.accountId)) {
        r.accountId = bank.id;
      }
    }

    d.accounts = d.accounts.filter(a => !ids.has(a.id));
  }

  if(!d.accounts.length) {
    d.accounts = initial().accounts;
  }

  return d;
}

let data = migrate(
  parse(localStorage.getItem(STORE)) ||
  parse(localStorage.getItem(LEGACY))
);

let page = 'home';
let month = now().slice(0,7);
let kind = 'expense';

let editTx = null;
let editProject = null;
let editRecurring = null;

let query = '';
let kindFilter = 'all';
let simAmount = 200;

try {
  localStorage.setItem(STORE, JSON.stringify(data));
} catch {}

/* ==============================
   CALCULS
============================== */

function now() {
  const d = new Date();
  const p = x => String(x).padStart(2,'0');

  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function uid() {
  return crypto.randomUUID?.() ||
    Date.now() + '-' + Math.random();
}

const num = x =>
  Number(String(x ?? '').replace(',','.'));

const round = x =>
  Math.round((x + Number.EPSILON) * 100) / 100;

const money = x =>
  Number(x || 0).toLocaleString('fr-CH',{
    style:'currency',
    currency:'CHF'
  });

const esc = x =>
  String(x ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

function save() {
  try {
    localStorage.setItem(STORE,JSON.stringify(data));
  } catch {
    alert('Impossible d’enregistrer sur cet appareil.');
  }
  render();
}

function balance(id) {
  let amount = Number(
    data.accounts.find(a => a.id === id)?.opening || 0
  );

  for(const t of data.transactions) {
    if(t.kind === 'income' && t.accountId === id)
      amount += t.amount;

    if(t.kind === 'expense' && t.accountId === id)
      amount -= t.amount;

    if(t.kind === 'transfer') {
      if(t.fromId === id) amount -= t.amount;
      if(t.toId === id) amount += t.amount;
    }
  }

  return round(amount);
}

const total = () =>
  round(data.accounts.reduce((s,a) => s + balance(a.id),0));

const reserved = id =>
  round(data.reserves
    .filter(x => x.projectId === id)
    .reduce((s,x) => s + Number(x.amount),0));

const reservedTotal = () =>
  round(data.projects.reduce((s,p) => s + reserved(p.id),0));

const available = () =>
  round(total() - reservedTotal());

const accName = id =>
  data.accounts.find(a => a.id === id)?.name || 'Compte';

const forMonth = (m=month) =>
  data.transactions.filter(t => t.date?.startsWith(m));

const sum = (kind,m=month) =>
  round(forMonth(m)
    .filter(t => t.kind === kind)
    .reduce((s,t) => s + t.amount,0));

const catSum = (c,m=month) =>
  round(forMonth(m)
    .filter(t => t.kind === 'expense' && t.category === c)
    .reduce((s,t) => s + t.amount,0));

const sortTx = (a,b) =>
  b.date.localeCompare(a.date) ||
  String(b.id).localeCompare(String(a.id));

/* Formulaires */

const opts = (pairs,v) =>
  pairs.map(([id,label]) => `
    <option value="${esc(id)}"
      ${String(id) === String(v) ? 'selected' : ''}>
      ${esc(label)}
    </option>`).join('');

const field = (label,name,value='',type='text',extra='') => `
  <div class="field">
    <label for="f_${name}">${esc(label)}</label>
    <input id="f_${name}" name="${esc(name)}"
      type="${type}" value="${esc(value)}" ${extra}>
  </div>`;

const select = (label,name,pairs,v) => `
  <div class="field">
    <label for="f_${name}">${esc(label)}</label>
    <select id="f_${name}" name="${esc(name)}">
      ${opts(pairs,v)}
    </select>
  </div>`;

function heading(title,desc='',showMonth=false) {
  return `
    <div class="toprow">
      <div>
        <h1>${title}</h1>
        <div class="caption">${desc}</div>
      </div>
      ${showMonth ? `
        <input id="month" type="month"
          aria-label="Mois" value="${month}">
      ` : ''}
    </div>`;
}

/* ==============================
   LISTES
============================== */

function txRows(items,actions=false) {
  if(!items.length) {
    return '<div class="empty">Aucune opération pour le moment.</div>';
  }

  return items.map(t => `
    <div class="line row">
      <div class="min0">
        <strong>${esc(t.description || (
          t.kind === 'transfer' ? 'Transfert' :
          t.kind === 'income' ? 'Revenu' :
          CATS[t.category] || 'Dépense'
        ))}</strong>

        <div class="caption">
          ${esc(t.date)} ·
          ${esc(t.kind === 'transfer'
            ? accName(t.fromId)+' → '+accName(t.toId)
            : accName(t.accountId))}
        </div>

        ${actions ? `
          <div class="buttons">
            <button class="btn btn-small"
              data-edit-tx="${esc(t.id)}">Modifier</button>
            <button class="btn btn-small btn-red"
              data-del-tx="${esc(t.id)}">Supprimer</button>
            ${t.kind === 'income' ? `
              <button class="btn btn-small"
                data-allocate="${esc(t.id)}">Répartir</button>
            ` : ''}
          </div>` : ''}
      </div>

      <strong class="${
        t.kind === 'expense' ? 'red' :
        t.kind === 'income' ? 'green' : ''
      }">
        ${t.kind === 'income' ? '+' :
          t.kind === 'expense' ? '−' : ''}
        ${money(t.amount)}
      </strong>
    </div>`).join('');
}

function projectRows(showDetails=false) {
  if(!data.projects.length) {
    return '<div class="empty">Aucun projet enregistré.</div>';
  }

  return data.projects.map(p => {
    const saved = reserved(p.id);

    return `
      <div class="line">
        <div class="row">
          <strong>${esc(p.name)}</strong>
          <span class="caption">
            ${money(saved)} / ${money(p.target)}
          </span>
        </div>

        <div class="track">
          <div class="fill" style="width:${
            Math.max(0,Math.min(100,saved/p.target*100))
          }%"></div>
        </div>

        <div class="caption">
          Encore ${money(Math.max(0,p.target-saved))}
          ${showDetails ? `

              ? money(p.ruleValue)
              : p.ruleValue+' %'} par revenu
          ` : ''}
        </div>
      </div>`;
  }).join('');
}

function forecast(p) {
  const left = Math.max(0,p.target-reserved(p.id));

  if(!left) return 'Objectif atteint.';

  const incomes = [...data.transactions]
    .filter(t => t.kind === 'income')
    .sort(sortTx)
    .slice(0,8);

  const mean = incomes.length
    ?incomes.reduce((s,t) => s+t.amount,0)/incomes.length
    :0;

  const step = p.ruleType === 'fixed'
    ?p.ruleValue
    :round(mean*p.ruleValue/100);

  let result = step>0
    ?`Environ ${Math.ceil(left/step)} revenu(s) similaire(s) nécessaire(s).`
    :'Pas assez de données pour estimer le nombre de revenus.';

  if(data.monthlyEstimate>0 &&
     p.ruleType === 'percent' &&
     p.ruleValue>0) {
    result += ` Si tu gagnes en moyenne ${
      money(data.monthlyEstimate)
    } par mois : environ ${
      Math.ceil(left/(data.monthlyEstimate*p.ruleValue/100))
    } mois.`;
  }

  return result;
}

/* ==============================
   RÉCURRENCES
============================== */

function due(rule) {
  if(rule.paused || !rule.startDate) return [];

  const out = [];
  const start = new Date(rule.startDate+'T12:00:00');
  const today = new Date(now()+'T12:00:00');

  for(let i=0;i<500;i++) {
    let date;

    if(rule.frequency === 'weekly') {
      date = new Date(
        start.getFullYear(),
        start.getMonth(),
        start.getDate()+7*i,
        12
      );
    } else if(rule.frequency === 'yearly') {
      const y = start.getFullYear()+i;
      const m = start.getMonth();

      date = new Date(y,m,Math.min(
        start.getDate(),
        new Date(y,m+1,0).getDate()
      ),12);
    } else {
      const y = start.getFullYear();
      const m = start.getMonth()+i;

      date = new Date(y,m,Math.min(
        start.getDate(),
        new Date(y,m+1,0).getDate()
      ),12);
    }

    if(date>today) break;

    const day = `${date.getFullYear()}-${
      String(date.getMonth()+1).padStart(2,'0')
    }-${String(date.getDate()).padStart(2,'0')}`;

    if(!data.transactions.some(t =>
      t.recurringId === rule.id &&
      t.occurrenceDate === day
    )) {
      out.push(day);
    }
  }

  return out;
}

/* ==============================
   AFFICHAGE ET NAVIGATION
============================== */

function render() {
  const views = {
    home,
    allExpenses,
    allProjects,
    operations,
    budgets,
    projects,
    recurring,
    settings,
    advice
  };

  document.getElementById('app').innerHTML = `
    <header>
      <div class="head">
        <div class="brand">
          ${brandLogo()}
          <span>Gestion-Argent</span>
        </div>

        <button class="btn btn-small"
          data-page="settings"
          aria-label="Paramètres">
          ${icon('settings')}
        </button>
      </div>
    </header>

    <div class="layout">
      <nav aria-label="Navigation principale">
        ${NAV.map(([k,i,name]) => `
          <button data-page="${k}"
            class="${k===page?'active':''}">
            ${icon(i)} ${name}
          </button>`).join('')}
      </nav>

      <main>${views[page]()}</main>
    </div>

    <div class="bottomnav">
      ${NAV.filter(x => x[0]!=='settings')
        .map(([k,i,name]) => `
          <button data-page="${k}"
            class="${k===page?'active':''}">
            ${icon(i)}
            <span>${name}</span>
          </button>`).join('')}
    </div>`;
}

function go(to) {
  page = to;
  editTx = null;
  editProject = null;
  editRecurring = null;
  render();
  window.scrollTo(0,0);
}

/* ==============================
   RÉPARTITION D'UN REVENU
============================== */

function allocate(txId) {
  const t = data.transactions.find(x => x.id===txId);

  if(!t || t.kind!=='income') return;

  if(data.reserves.some(x => x.sourceTx===txId)) {
    return alert('Ce revenu a déjà été réparti.');
  }

  let room = Math.max(0,Math.min(t.amount,available()));

  const priority = {
    high:0,
    normal:1,
    low:2
  };

  const projects = [...data.projects].sort((a,b) =>
    (priority[a.priority]??1) -
    (priority[b.priority]??1)
  );

  const proposals = [];

  for(const p of projects) {
    const rest = Math.max(0,p.target-reserved(p.id));

    const desired = p.ruleType==='fixed'
      ?Number(p.ruleValue)
      :round(t.amount*p.ruleValue/100);

    const amount = round(
      Math.max(0,Math.min(desired,rest,room))
    );

    if(amount>0) {
      proposals.push({p,amount});
      room = round(room-amount);
    }
  }

  if(!proposals.length) return;

  if(confirm(
    'Réserver une partie de ce revenu ?\n\n' +
    proposals.map(x =>
      x.p.name+' : '+money(x.amount)
    ).join('\n')
  )) {
    for(const x of proposals) {
      data.reserves.push({
        id:uid(),
        projectId:x.p.id,
        amount:x.amount,
        date:t.date,
        sourceTx:t.id
      });
    }
    save();
  }
}

/* ==============================
   ENREGISTREMENT
============================== */

function submitTx(f) {
  const amount = round(num(f.get('amount')));
  const date = String(f.get('date')||'');
  const chosen = String(f.get('kind'));

  if(!Number.isFinite(amount)||amount<=0||!date) {
    return alert('Montant ou date invalide.');
  }

  const old = data.transactions.find(t => t.id===editTx);

  const t = {
    id:old?.id||uid(),
    kind:chosen,
    amount,
    date,
    description:String(f.get('description')||'').trim()
  };

  if(chosen==='transfer') {
    t.fromId = f.get('fromId');
    t.toId = f.get('toId');

    if(t.fromId===t.toId) {
      return alert('Choisis deux comptes différents.');
    }
  } else {
    t.accountId = f.get('accountId');

    if(chosen==='expense') {
      t.category = f.get('category');
    }
  }

  if(old) {
    t.recurringId = old.recurringId;
    t.occurrenceDate = old.occurrenceDate;

    if(old.kind!==chosen ||
       old.amount!==amount ||
       old.date!==date) {
      data.reserves = data.reserves.filter(r =>
        r.sourceTx!==old.id
      );
    }

    data.transactions = data.transactions.map(x =>
      x.id===old.id?t:x
    );
  } else {
    data.transactions.push(t);
  }

  editTx = null;
  kind = chosen;

  save();

  if(!old && chosen==='income') {
    allocate(t.id);
  }
}

function onSubmit(ev) {
  ev.preventDefault();

  const form = ev.target;
  const f = new FormData(form);

  if(form.id==='txForm') {
    return submitTx(f);
  }

  if(form.id==='budgetForm') {
    const updated = {...data.budgets};

    for(const c of Object.keys(CATS)) {
      const v = num(f.get('budget_'+c)||0);

      if(!Number.isFinite(v)||v<0) {
        return alert('Budget invalide.');
      }

      updated[c] = round(v);
    }

    data.budgets = updated;
    return save();
  }

  if(form.id==='projectForm') {
    const name = String(f.get('name')||'').trim();
    const target = round(num(f.get('target')));
    const ruleType = f.get('ruleType');
    const ruleValue = round(num(f.get('ruleValue')));

    if(!name ||
       !Number.isFinite(target) ||
       target<=0 ||
       !Number.isFinite(ruleValue) ||
       ruleValue<0 ||
       (ruleType==='percent' && ruleValue>100)) {
      return alert('Projet invalide.');
    }

    const other = data.projects
      .filter(x =>
        x.id!==editProject &&
        x.ruleType==='percent'
      )
      .reduce((s,x) => s+Number(x.ruleValue),0);

    if(ruleType==='percent' && other+ruleValue>100.001) {
      return alert(
        'La somme des pourcentages des projets dépasse 100 %.'
      );
    }

    const item = {
      id:editProject||uid(),
      name,
      target,
      ruleType,
      ruleValue,
      priority:f.get('priority'),
      deadline:f.get('deadline')
    };

    if(editProject) {
      data.projects = data.projects.map(p =>
        p.id===editProject?item:p
      );
    } else {
      data.projects.push(item);
    }

    editProject = null;
    return save();
  }

  if(form.id==='recForm') {
    const description =
      String(f.get('description')||'').trim();

    const amount = round(num(f.get('amount')));

    if(!description||!Number.isFinite(amount)||amount<=0) {
      return alert('Récurrence invalide.');
    }

    const old = data.recurring.find(x =>
      x.id===editRecurring
    );

    const item = {
      id:editRecurring||uid(),
      description,
      amount,
      kind:f.get('kind'),
      frequency:f.get('frequency'),
      startDate:f.get('startDate'),
      accountId:f.get('accountId'),
      category:f.get('category'),
      paused:old?.paused||false
    };

    if(editRecurring) {
      data.recurring = data.recurring.map(x =>
        x.id===editRecurring?item:x
      );
    } else {
      data.recurring.push(item);
    }

    editRecurring = null;
    return save();
  }

  if(form.id==='accountForm') {
    const name = String(f.get('name')||'').trim();
    const opening = round(num(f.get('opening')));

    if(!name||!Number.isFinite(opening)) {
      return alert('Compte invalide.');
    }

    data.accounts.push({
      id:uid(),
      name,
      opening
    });

    return save();
  }

  if(form.id==='estimateForm') {
    const value = round(num(f.get('estimate')));

    if(!Number.isFinite(value)||value<0) {
      return alert('Montant invalide.');
    }

    data.monthlyEstimate = value;
    return save();
  }

  /* Sauvegarde de la règle personnalisée */

  if(form.id==='ruleForm') {
    const next = {};
    let sumP = 0;

    for(const k of ['needs','wants','savings']) {
      const name =
        String(f.get('ruleName_'+k)||'').trim();

      const percent =
        round(num(f.get('rulePercent_'+k)));

      const description =
        String(f.get('ruleDescription_'+k)||'').trim();

      if(!name ||
         !Number.isFinite(percent) ||
         percent<0 ||
         percent>100) {
        return alert(
          'Vérifie les pourcentages et les noms.'
        );
      }

      next[k] = {
        name,
        percent,
        description
      };

      sumP += percent;
    }

    if(Math.abs(sumP-100)>0.005) {
      return alert(
        'Les trois pourcentages doivent faire ' +
        'exactement 100 %. Total actuel : ' +
        sumP.toFixed(2) + ' %.'
      );
    }

    data.allocationRule = next;
    return save();
  }
}

/* ==============================
   BOUTONS
============================== */

function onClick(ev) {
  const b = ev.target.closest('button');
  if(!b) return;

  if(b.dataset.page) {
    return go(b.dataset.page);
  }

  if(b.hasAttribute('data-cancel')) {
    editTx = null;
    editProject = null;
    editRecurring = null;
    return render();
  }

  if(b.dataset.editTx) {
    editTx = b.dataset.editTx;
    kind = data.transactions.find(t =>
      t.id===editTx
    )?.kind||'expense';

    page = 'operations';
    return render();
  }

  if(b.dataset.delTx) {
    if(!confirm('Supprimer cette opération ?')) return;

    data.transactions = data.transactions.filter(t =>
      t.id!==b.dataset.delTx
    );

    data.reserves = data.reserves.filter(r =>
      r.sourceTx!==b.dataset.delTx
    );

    return save();
  }

  if(b.dataset.allocate) {
    return allocate(b.dataset.allocate);
  }

  /* Actions des projets */

  if(b.dataset.project) {
    const p = data.projects.find(x =>
      x.id===b.dataset.id
    );

    if(!p) return;

    const action = b.dataset.project;

    if(action==='edit') {
      editProject = p.id;
      page = 'projects';
      return render();
    }

    if(action==='delete') {
      if(reserved(p.id)>0) {
        return alert(
          'Libère d’abord tout l’argent réservé.'
        );
      }

      if(!confirm('Supprimer le projet ?')) return;

      data.projects = data.projects.filter(x =>
        x.id!==p.id
      );

      data.reserves = data.reserves.filter(x =>
        x.projectId!==p.id
      );

      return save();
    }

    const max = action==='add'
      ?Math.max(0,Math.min(
        available(),
        p.target-reserved(p.id)
      ))
      :reserved(p.id);

    const input = prompt(
      `Montant à ${
        action==='add'?'réserver':'libérer'
      } (max. ${money(max)})`,
      '20'
    );

    if(input===null) return;

    const amount = round(num(input));

    if(!Number.isFinite(amount) ||
       amount<=0 ||
       amount>max+0.001) {
      return alert('Montant invalide.');
    }

    data.reserves.push({
      id:uid(),
      projectId:p.id,
      amount:action==='add'?amount:-amount,
      date:now()
    });

    return save();
  }

  /* Actions des récurrences */

  if(b.dataset.rec) {
    const r = data.recurring.find(x =>
      x.id===b.dataset.id
    );

    if(!r) return;

    const action = b.dataset.rec;

    if(action==='edit') {
      editRecurring = r.id;
      page = 'recurring';
      return render();
    }

    if(action==='pause') {
      r.paused = !r.paused;
      return save();
    }

    if(action==='delete') {
      if(!confirm(
        'Supprimer la récurrence ? ' +
        'Les anciennes opérations seront conservées.'
      )) return;

      data.recurring = data.recurring.filter(x =>
        x.id!==r.id
      );

      return save();
    }

    if(action==='record') {
      const dates = due(r);

      if(!dates.length) return;

      if(!confirm(
        `Enregistrer ${dates.length} échéance(s), ` +
        `soit ${money(dates.length*r.amount)} ?`
      )) return;

      for(const date of dates) {
        data.transactions.push({
          id:uid(),
          kind:r.kind,
          amount:r.amount,
          date,
          description:r.description,
          accountId:r.accountId,
          category:r.category,
          recurringId:r.id,
          occurrenceDate:date
        });
      }

      return save();
    }
  }

  /* Comptes */

  if(b.dataset.account) {
    const a = data.accounts.find(x =>
      x.id===b.dataset.account
    );

    if(!a) return;

    const name = prompt('Nom du compte',a.name);
    if(name===null) return;

    const entered = prompt(
      'Solde de départ',a.opening
    );
    if(entered===null) return;

    const amount = round(num(entered));

    if(!name.trim()||!Number.isFinite(amount)) {
      return alert('Valeur invalide.');
    }

    a.name = name.trim();
    a.opening = amount;

    return save();
  }

  /* Réinitialiser la règle budgétaire */

  if(b.id==='resetRule') {
    if(!confirm(
      'Remettre la règle 50/30/20 et ses ' +
      'descriptions par défaut ?'
    )) return;

    data.allocationRule = defaultRule();
    return save();
  }
}

/* ==============================
   CHAMPS INTERACTIFS
============================== */

function onChange(ev) {
  const el = ev.target;

  if(el.id==='month') {
    month = el.value;
    return render();
  }

  if(el.name==='kind' && el.closest('#txForm')) {
    const form = el.form;

    const draft = {
      amount:form.elements.amount.value,
      date:form.elements.date.value,
      description:form.elements.description.value
    };

    kind = el.value;
    render();

    const next = document.getElementById('txForm');

    for(const k of Object.keys(draft)) {
      next.elements[k].value = draft[k];
    }

    return;
  }

  if(el.name==='filter') {
    kindFilter = el.value;
    return render();
  }
}

function onInput(ev) {
  const el = ev.target;

  if(el.name==='search') {
    query = el.value;
    const pos = el.selectionStart;

    render();

    const next = document.querySelector(
      '[name="search"]'
    );

    next?.focus();
    next?.setSelectionRange(pos,pos);
  }

  /* Simulateur de la règle */

  if(el.name==='simulate') {
    simAmount = Math.max(0,num(el.value)||0);

    for(const key of ['needs','wants','savings']) {
      const target = document.getElementById(
        'preview-'+key
      );

      if(target) {
        target.textContent = money(
          round(
            simAmount *
            data.allocationRule[key].percent/100
          )
        );
      }
    }
  }
}

document.addEventListener('submit',onSubmit);
document.addEventListener('click',onClick);
document.addEventListener('change',onChange);
document.addEventListener('input',onInput);

render();
</script>
